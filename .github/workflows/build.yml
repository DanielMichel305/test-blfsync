name: Build and deploy frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-push:
    name: Build and push container image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_repository: ${{ steps.image.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Define image repository
        id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/my-app-frontend" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

  deploy:
    name: Deploy frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USERNAME: ${{ github.actor }}
      IMAGE_REF: ${{ needs.build-and-push.outputs.image_repository }}@${{ needs.build-and-push.outputs.image_digest }}
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Upload deployment Compose file
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ secrets.DEPLOY_SSH_HOST_FINGERPRINT }}
          source: docker-compose.yml
          target: /opt/frontend
          overwrite: true
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ secrets.DEPLOY_SSH_HOST_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_REF
          command_timeout: 15m
          script: |
            set -euo pipefail
            umask 077
            export DOCKER_CONFIG="$(mktemp -d)"
            cleanup() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup EXIT
            cd /opt/frontend
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker pull "$IMAGE_REF"
            IMAGE_REF="$IMAGE_REF" docker compose -f docker-compose.yml up -d --no-build --no-deps --force-recreate --wait --wait-timeout 180 blfriends-frontend
