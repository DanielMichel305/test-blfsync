          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateTestimonyRequest"
      responses:
        "201":
          $ref: "#/components/responses/TestimonyMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /testimonies/manage:
    get:
      tags: [Testimonies]
      summary: List testimonies for management
      description: Admin-only.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, archived] }
        - name: visibilityState
          in: query
          schema: { type: string, enum: [draft, scheduled, active, expired, archived] }
        - name: trackId
          in: query
          schema: { type: string, format: uuid }
        - name: global
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated testimony-management list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedTestimonyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /testimonies/{id}:
    parameters:
      - $ref: "#/components/parameters/TestimonyId"
    get:
      tags: [Testimonies]
      summary: Get a testimony for management
      description: Admin-only.
      responses:
        "200":
          description: Testimony including management metadata.
          content:
            application/json:
              schema:
                type: object
                required: [testimony]
                properties:
                  testimony:
                    $ref: "#/components/schemas/ManagedTestimony"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Testimonies]
      summary: Update a testimony
      description: Admin-only. `coverImage` is an optional replacement image upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateTestimonyRequest"
      responses:
        "200":
          $ref: "#/components/responses/TestimonyMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Testimonies]
      summary: Delete a testimony
      description: Admin-only. Archived testimonies cannot be deleted.
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /webhooks:
    post:
      tags: [Webhooks]
      summary: Receive a Stripe webhook
      description: This endpoint requires Stripe's signature header and the unmodified JSON request body. It does not use bearer authentication.
      security: []
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event effects and receipt committed transactionally, ignored as unsupported, or already processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceipt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MinistryTrackId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnnouncementId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestimonyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BadgeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 200
        default: ""
    Role:
      name: role
      in: query
      schema:
        type: string
        enum: [admin, family, friend]
    SortOrderDesc:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC
    ModerationStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [visible, removed]
    ThreadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThreadIdNamed:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentIdNamedId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReactionType:
      name: reactionType
      in: path
      required: true
      schema:
        type: string
        enum: [like, join_prayer]
  requestBodies:
    ModerationReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1
                maxLength: 500
  responses:
    SuccessMessage:
      description: Operation completed successfully.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A valid access token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated user lacks permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested content was not found or is not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested state transition has already occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SubscriptionRateLimited:
      description: The authenticated user exceeded the subscription-operation rate limit. Retry after the interval indicated by the response headers.
      headers:
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error:
                type: string
              code:
                type: string
                enum: [SUBSCRIPTION_RATE_LIMITED]
    UserMessage:
      description: User operation completed successfully.
      content:
        application/json:
          schema:
            type: object
            required: [message, user]
            properties:
              message:
                type: string
              user:
                $ref: "#/components/schemas/User"
              expiresAt:
                type: string
                format: date-time
    InvitationMessage:
      description: Invitation operation completed successfully.
      content:
        application/json:
          schema:
            type: object
            required: [message, invitation]
            properties:
              message:
                type: string
              invitation:
                $ref: "#/components/schemas/Invitation"
    AnnouncementMessage:
      description: Announcement operation completed successfully.
      content:
        application/json:
          schema:
            type: object
            required: [message, announcement]
            properties:
              message:
                type: string
              announcement:
                $ref: "#/components/schemas/ManagedAnnouncement"
    TestimonyMessage:
      description: Testimony operation completed successfully.
      content:
        application/json:
          schema:
            type: object
            required: [message, testimony]
            properties:
              message:
                type: string
              testimony:
                $ref: "#/components/schemas/ManagedTestimony"
  schemas:
    CreateSubscriptionCheckoutRequest:
      type: object
      additionalProperties: false
      required:
        - subscriptionAmount
        - subscriptionCurrency
        - ministryTrackId
        - idempotencyKey
        - subscriptionType
      properties:
        subscriptionAmount:
          type: integer
          minimum: 1
          maximum: 999999
          description: Whole USD amount; yearly subscriptions must meet twelve times the track monthly minimum.
        subscriptionCurrency:
          type: string
          enum: [usd]
        ministryTrackId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          format: uuid
        subscriptionType:
          type: string
          enum: [one-time, recurring]
        interval:
          type: string
          enum: [month, year]
          description: Required for recurring requests and forbidden for one-time requests.
    UpdateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        subscriptionAmount:
          type: integer
          minimum: 1
          maximum: 999999
        interval:
          type: string
          enum: [month, year]
        idempotencyKey:
          type: string
          format: uuid
    CheckoutResponse:
      type: object
      required: [paymentRequestId, commitmentId, subscriptionId, checkout, status]
      properties:
        paymentRequestId:
          type: string
          format: uuid
        commitmentId:
          type: string
          format: uuid
          description: Durable commitment created for this one-time or recurring checkout.
        subscriptionId:
          type: string
          format: uuid
          nullable: true
        checkout:
          type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
        status:
          type: string
          enum: [pending, completed, failed, expired]
    SubscriptionStatus:
      type: object
      required:
        - id
        - ministryTrackId
        - amount
        - currency
        - interval
        - subscriptionStatus
        - accessStatus
        - cancellation
        - billingReviewStatus
      properties:
        id:
          type: string
          format: uuid
        ministryTrackId:
          type: string
          format: uuid
        amount:
          type: number
          nullable: true
          description: Confirmed amount in whole USD; null before the initial subscription confirmation.
        currency:
          type: string
          nullable: true
        interval:
          type: string
          nullable: true
          enum: [month, year, null]
        subscriptionStatus:
          type: string
          enum: [pending, incomplete, incomplete_expired, trialing, active, past_due, unpaid, paused, canceled]
        accessStatus:
          type: string
          enum: [pending, active, grace, inactive, cancelled]
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        cancellation:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [none, pending, scheduled, cancelled]
            requestedAt:
              type: string
              format: date-time
              nullable: true
            scheduledAt:
              type: string
              format: date-time
              nullable: true
            effectiveAt:
              type: string
              format: date-time
              nullable: true
            cancelledAt:
              type: string
              format: date-time
              nullable: true
        billingReviewStatus:
          type: string
          enum: [none, dispute_open, dispute_won, dispute_lost]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubscriptionUpdateResponse:
      oneOf:
        - type: object
          required: [status, subscriptionId]
          properties:
            status:
              type: string
              enum: [pending]
            subscriptionId:
              type: string
              format: uuid
        - type: object
          required: [status, subscription]
          properties:
            status:
              type: string
              enum: [unchanged, updated]
            subscription:
              $ref: "#/components/schemas/SubscriptionStatus"
        - type: object
          required: [status, subscriptionId, portalUrl]
          properties:
            status:
              type: string
              enum: [requires_action]
            subscriptionId:
              type: string
              format: uuid
            portalUrl:
              type: string
              format: uri
    SubscriptionCancellationResponse:
      type: object
      required: [status, subscription]
      properties:
        status:
          type: string
          enum: [cancelled, cancellation_pending]
        subscription:
          $ref: "#/components/schemas/SubscriptionStatus"
        errorCode:
          type: string
          nullable: true
          description: Present when the cancellation remains pending because the provider could not be confirmed.
    UserDeletionCancellationSummary:
      type: object
      required: [requested, confirmed, pending, deletionFinalized]
      properties:
        requested:
          type: integer
          minimum: 0
        confirmed:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        deletionFinalized:
          type: boolean
    UserDeletionResponse:
      type: object
      required: [message, deletionStatus, operationId, cancellation]
      properties:
        message:
          type: string
        deletionStatus:
          type: string
          enum: [deleted, pending_cancellation]
        operationId:
          type: string
          format: uuid
        cancellation:
          $ref: "#/components/schemas/UserDeletionCancellationSummary"
    WebhookReceipt:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          enum: [true]
        ignored:
          type: boolean
          description: True when the Stripe event type is not handled by this API.
        duplicate:
          type: boolean
          description: True when the same Stripe event ID had already been processed and committed.
        status:
          type: string
          enum: [processed]
    Badge:
      type: object
      required:
        - id
        - code
        - name
        - description
        - order
        - triggerKey
        - requirementConfig
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        order:
          type: integer
          minimum: 0
        triggerKey:
          type: string
          enum: [ministry.track.duration, action.login, action.donation]
        requirementConfig:
          type: object
          additionalProperties: true
          description: Trigger-specific configuration validated by the badge trigger registry.
        isActive:
          type: boolean
        definitionLockedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateBadgeRequest:
      type: object
      additionalProperties: false
      required: [code, name, description, triggerKey, requirementConfig]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 2000
        order:
          type: integer
          minimum: 0
          default: 0
        triggerKey:
          type: string
          enum: [ministry.track.duration, action.login, action.donation]
        requirementConfig:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
          default: true
    UpdateBadgeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 2000
        order:
          type: integer
          minimum: 0
        triggerKey:
          type: string
          enum: [ministry.track.duration, action.login, action.donation]
        requirementConfig:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
    BadgePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [badges]
          properties:
            badges:
              type: array
              items:
                $ref: "#/components/schemas/Badge"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable code supplied for selected application and database errors.
        details:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
            - type: object
              additionalProperties: true
    Pagination:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    PublicAuthor:
      type: object
      nullable: true
      required: [id, firstName, profilePictureUrl]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        profilePictureUrl:
          type: string
          format: uri
          nullable: true
    ReactionSummary:
      type: object
      required: [likeCount, joinPrayerCount, viewerHasLiked, viewerHasJoinedPrayer]
      properties:
        likeCount:
          type: integer
          minimum: 0
        joinPrayerCount:
          type: integer
          minimum: 0
        viewerHasLiked:
          type: boolean
        viewerHasJoinedPrayer:
          type: boolean
    PrayerWallThread:
      type: object
      required:
        - id
        - type
        - body
        - isAnonymous
        - author
        - reactions
        - commentCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [prayer, praise]
        body:
          type: string
          minLength: 1
          maxLength: 1000
        isAnonymous:
          type: boolean
        author:
          $ref: "#/components/schemas/PublicAuthor"
        authorDisplayName:
          type: string
          nullable: true
          description: Anonymous for anonymous content; otherwise null.
        reactions:
          $ref: "#/components/schemas/ReactionSummary"
        commentCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PrayerWallComment:
      type: object
      required: [id, threadId, body, isAnonymous, author, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 500
        isAnonymous:
          type: boolean
        author:
          $ref: "#/components/schemas/PublicAuthor"
        authorDisplayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateThreadRequest:
      type: object
      additionalProperties: false
      required: [type, body]
      properties:
        type:
          type: string
          enum: [prayer, praise]
        body:
          type: string
          minLength: 1
          maxLength: 1000
        isAnonymous:
          type: boolean
          default: false
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
        isAnonymous:
          type: boolean
          default: false
    ThreadPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [threads]
          properties:
            threads:
              type: array
              items:
                $ref: "#/components/schemas/PrayerWallThread"
    CommentPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/PrayerWallComment"
    ModerationFields:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [visible, removed]
        removedAt:
          type: string
          format: date-time
          nullable: true
        removalReason:
          type: string
          nullable: true
        removalSource:
          type: string
          enum: [author, moderator]
          nullable: true
        removedBy:
          type: object
          nullable: true
          additionalProperties: true
    ManagedThread:
      allOf:
        - $ref: "#/components/schemas/PrayerWallThread"
        - $ref: "#/components/schemas/ModerationFields"
    ManagedComment:
      allOf:
        - $ref: "#/components/schemas/PrayerWallComment"
        - $ref: "#/components/schemas/ModerationFields"
        - type: object
          properties:
            thread:
              type: object
              nullable: true
              additionalProperties: true
    ManagedCommentPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/ManagedComment"
    HealthStatus:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    User:
      type: object
      required:
        - id
        - firstName
        - email
        - role
        - twoFactorEnabled
        - isActive
        - hasPassword
        - invitationPending
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
          nullable: true
        username:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, family, friend]
        twoFactorEnabled:
          type: boolean
        profilePictureUrl:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        hasPassword:
          type: boolean
        invitationPending:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserSummary:
      type: object
      required: [id, firstName, email]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    VerifyTwoFactorRequest:
      type: object
      additionalProperties: false
      required: [tokenId, code]
      properties:
        tokenId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^\\d{6}$"
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
