openapi: 3.0.3
info:
  title: Better Life Foundation API
  version: 1.0.0
  description: Authenticated backend API for Better Life Foundation.
servers:
  - url: http://localhost:3001/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service health checks.
  - name: Authentication
    description: Sign-in, invitation acceptance, tokens, and account security.
  - name: Users
    description: User administration and earned-badge lookups.
  - name: Invitations
    description: Invitation lifecycle management.
  - name: Audit Logs
    description: Admin-only audit history.
  - name: Ministry Tracks
    description: Ministry-track browsing and administration.
  - name: Announcements
    description: Dashboard announcements and their admin management workflow.
  - name: Notifications
    description: User notification feed and admin notification delivery.
  - name: Testimonies
    description: Testimony feed and admin editorial workflow.
  - name: Webhooks
    description: External payment-provider callbacks.
  - name: Subscriptions
    description: One-time donations and recurring ministry-track subscriptions.
  - name: Badges
    description: Admin-only badge definition management.
  - name: Prayer Wall
    description: Prayer and praise feed interactions.
  - name: Prayer Wall Moderation
    description: Admin-only prayer wall moderation.
paths:
  /badges:
    get:
      tags: [Badges]
      summary: List badge definitions
      description: Admin-only management view of active and retired badge definitions.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, name, order, isActive]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        "200":
          description: Paginated badge definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Badges]
      summary: Create a badge definition
      description: Admin-only. Active definitions are locked when created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBadgeRequest"
      responses:
        "201":
          description: Badge definition created.
          content:
            application/json:
              schema:
                type: object
                required: [message, badge]
                properties:
                  message:
                    type: string
                  badge:
                    $ref: "#/components/schemas/Badge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /badges/{id}:
    parameters:
      - $ref: "#/components/parameters/BadgeId"
    get:
      tags: [Badges]
      summary: Retrieve a badge definition
      responses:
        "200":
          description: Badge definition.
          content:
            application/json:
              schema:
                type: object
                required: [badge]
                properties:
                  badge:
                    $ref: "#/components/schemas/Badge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Badges]
      summary: Update a badge definition
      description: Admin-only. Trigger, requirement, and code fields cannot change after a definition is locked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBadgeRequest"
      responses:
        "200":
          description: Badge definition updated.
          content:
            application/json:
              schema:
                type: object
                required: [message, badge]
                properties:
                  message:
                    type: string
                  badge:
                    $ref: "#/components/schemas/Badge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Badges]
      summary: Delete a retired, unawarded badge definition
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /badges/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/BadgeId"
    patch:
      tags: [Badges]
      summary: Retire a badge definition
      description: Makes the badge inactive without removing existing awards.
      responses:
        "200":
          description: Badge retired. Repeated retirement is idempotent.
          content:
            application/json:
              schema:
                type: object
                required: [message, badge]
                properties:
                  message:
                    type: string
                  badge:
                    $ref: "#/components/schemas/Badge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /prayer-wall:
    get:
      tags: [Prayer Wall]
      summary: List visible prayer wall threads
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema:
            type: string
            enum: [all, prayer, praise]
            default: all
      responses:
        "200":
          description: Paginated newest-first prayer wall feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Prayer Wall]
      summary: Create a prayer or praise thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequest"
      responses:
        "201":
          description: Thread created.
          content:
            application/json:
              schema:
                type: object
                required: [message, thread]
                properties:
                  message:
                    type: string
                  thread:
                    $ref: "#/components/schemas/PrayerWallThread"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /prayer-wall/{id}:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    get:
      tags: [Prayer Wall]
      summary: Get a visible thread and its comments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Thread detail with paginated comments.
          content:
            application/json:
              schema:
                type: object
                required: [thread, comments]
                properties:
                  thread:
                    $ref: "#/components/schemas/PrayerWallThread"
                  comments:
                    $ref: "#/components/schemas/CommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prayer Wall]
      summary: Soft-delete the current user's thread
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /prayer-wall/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    get:
      tags: [Prayer Wall]
      summary: List visible comments on a visible thread
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated comments ordered oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Prayer Wall]
      summary: Add a comment to a visible thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                type: object
                required: [message, comment]
                properties:
                  message:
                    type: string
                  comment:
                    $ref: "#/components/schemas/PrayerWallComment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /prayer-wall/{threadId}/comments/{commentId}:
    delete:
      tags: [Prayer Wall]
      summary: Soft-delete the current user's comment
      parameters:
        - $ref: "#/components/parameters/ThreadIdNamed"
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /prayer-wall/{id}/reactions/{reactionType}:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
      - $ref: "#/components/parameters/ReactionType"
    put:
      tags: [Prayer Wall]
      summary: Add a reaction idempotently
      description: Like and join-in-prayer are independent and both are available on prayers and praises.
      responses:
        "200":
          description: Current reaction state and whether a row was created.
          content:
            application/json:
              schema:
                type: object
                required: [created, reactions]
                properties:
                  created:
                    type: boolean
                  reactions:
                    $ref: "#/components/schemas/ReactionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prayer Wall]
      summary: Remove a reaction idempotently
      responses:
        "200":
          description: Current reaction state and whether a row was removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed, reactions]
                properties:
                  removed:
                    type: boolean
                  reactions:
                    $ref: "#/components/schemas/ReactionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /prayer-wall/manage/threads:
    get:
      tags: [Prayer Wall Moderation]
      summary: List threads for moderation
      description: Anonymous author identities are included for admins.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          schema:
            type: string
            enum: [prayer, praise]
        - $ref: "#/components/parameters/ModerationStatus"
      responses:
        "200":
          description: Paginated moderation thread queue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    required: [threads]
                    properties:
                      threads:
                        type: array
                        items:
                          $ref: "#/components/schemas/ManagedThread"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /prayer-wall/manage/threads/{id}:
    parameters:
      - $ref: "#/components/parameters/ThreadId"
    get:
      tags: [Prayer Wall Moderation]
      summary: Get a thread for moderation
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Managed thread and all comments, including removed comments.
          content:
            application/json:
              schema:
                type: object
                required: [thread, comments]
                properties:
                  thread:
                    $ref: "#/components/schemas/ManagedThread"
                  comments:
                    $ref: "#/components/schemas/ManagedCommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prayer Wall Moderation]
      summary: Remove a thread from the public feed
      description: Removing a thread hides its entire comment subtree without deleting records.
      requestBody:
        $ref: "#/components/requestBodies/ModerationReason"
      responses:
        "200":
          description: Updated managed thread detail.
          content:
            application/json:
              schema:
                type: object
                required: [message, thread, comments]
                properties:
                  message:
                    type: string
                  thread:
                    $ref: "#/components/schemas/ManagedThread"
                  comments:
                    $ref: "#/components/schemas/ManagedCommentPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /prayer-wall/manage/threads/{id}/restore:
    patch:
      tags: [Prayer Wall Moderation]
      summary: Restore a removed thread
      description: Previously visible comments become visible again; independently removed comments stay removed.
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Restored managed thread detail.
          content:
            application/json:
              schema:
                type: object
                required: [message, thread, comments]
                properties:
                  message:
                    type: string
                  thread:
                    $ref: "#/components/schemas/ManagedThread"
                  comments:
                    $ref: "#/components/schemas/ManagedCommentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /prayer-wall/manage/comments:
    get:
      tags: [Prayer Wall Moderation]
      summary: List comments for moderation
      description: This is a separate queue from thread moderation and includes anonymous author identities.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ModerationStatus"
        - name: threadId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated moderation comment queue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    required: [comments]
                    properties:
                      comments:
                        type: array
                        items:
                          $ref: "#/components/schemas/ManagedComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /prayer-wall/manage/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/CommentIdNamedId"
    get:
      tags: [Prayer Wall Moderation]
      summary: Get a comment for moderation
      responses:
        "200":
          description: Managed comment detail.
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment:
                    $ref: "#/components/schemas/ManagedComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Prayer Wall Moderation]
      summary: Remove a comment from the public feed
      requestBody:
        $ref: "#/components/requestBodies/ModerationReason"
      responses:
        "200":
          description: Updated managed comment.
          content:
            application/json:
              schema:
                type: object
                required: [message, comment]
                properties:
                  message:
                    type: string
                  comment:
                    $ref: "#/components/schemas/ManagedComment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /prayer-wall/manage/comments/{id}/restore:
    patch:
      tags: [Prayer Wall Moderation]
      summary: Restore a removed comment
      parameters:
        - $ref: "#/components/parameters/CommentIdNamedId"
      responses:
        "200":
          description: Restored managed comment.
          content:
            application/json:
              schema:
                type: object
                required: [message, comment]
                properties:
                  message:
                    type: string
                  comment:
                    $ref: "#/components/schemas/ManagedComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Create a one-time or recurring Checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionCheckoutRequest"
      responses:
        "201":
          description: Stripe Checkout session created or returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/SubscriptionRateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Subscriptions]
      summary: Get a recurring subscription and access state
      responses:
        "200":
          description: Sanitized subscription status without Stripe identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/SubscriptionRateLimited"
    patch:
      tags: [Subscriptions]
      summary: Change an active recurring subscription immediately; one-time commitments are not manageable here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: Subscription was unchanged or this update was already confirmed by a subscription webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUpdateResponse"
        "202":
          description: Update awaits a subscription webhook, optionally requiring customer action in Stripe Billing Portal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUpdateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/SubscriptionRateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Subscriptions]
      summary: Cancel a recurring subscription immediately; one-time commitments are not cancellable here.
      description: Immediately requests Stripe cancellation without refunds or proration. Local state awaits customer.subscription.deleted, or checkout.session.expired for open Checkout. Failed requests are retried by billing maintenance.
      responses:
        "200":
          description: Subscription and future Stripe billing cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancellationResponse"
        "202":
          description: Cancellation was requested but Stripe has not yet confirmed a terminal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancellationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/SubscriptionRateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /subscriptions/{id}/billing-portal:
    post:
      tags: [Subscriptions]
      summary: Create a Stripe Billing Portal session
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "201":
          description: Short-lived Stripe Billing Portal URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/SubscriptionRateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /health:
    get:
      tags: [System]
      summary: Check API health
      security: []
      servers:
        - url: http://localhost:3001
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with an email address and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded without two-factor verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "202":
          description: Two-factor verification is required before tokens are issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/verify-2fa:
    post:
      tags: [Authentication]
      summary: Complete a two-factor sign-in challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTwoFactorRequest"
      responses:
        "200":
          description: Verification succeeded and tokens were issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new access and refresh-token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "500":
          $ref: "#/components/responses/ServerError"
  /auth/profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/2fa/enable:
    post:
      tags: [Authentication]
